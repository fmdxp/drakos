# Example for the version 1 SSM policy parser.
# This file is not consumed during boot yet.
version = 1

[service storage]
name = "Storage Service"
exec = /system/services/storage.drk
restart = on-failure
restart-limit = 5
restart-backoff-ms = 250
restart-backoff-max-ms = 30000
startup-timeout-ms = 5000
shutdown-timeout-ms = 3000

[service logger]
name = "System Logger"
exec = /system/services/logger.drk
arg = --system
env = LOG_LEVEL=info
restart = always

[service shell]
name = "System Shell"
exec = /system/services/shell.drk
depends = !storage
depends = ?logger
optional = true
restart = never
