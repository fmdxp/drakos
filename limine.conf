timeout: 3
/drakos (normal)
    protocol: limine
    path: boot():/kernel.elf
    cmdline: drakos.mode=normal
/drakos (verbose)
    protocol: limine
    path: boot():/kernel.elf
    cmdline: drakos.mode=verbose
/drakos (recovery)
    protocol: limine
    path: boot():/kernel.elf
    cmdline: drakos.mode=recovery
